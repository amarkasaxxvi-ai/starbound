 g.ints.forEach(o=>{if(TV.distanceTo(o.p)<(o.rg||6)&&!CX.int)CX.int=o});g.npcs.forEach((n,i)=>n.position.y=1.3+Math.sin(tm*1.5+i)*.2);if(g.te)g.te.rotation.y+=dt;
 if(g.cd>0)g.cd-=dt;if(g.rt<1){g.rt+=dt*.9;g.ring.scale.setScalar(1+g.rt*42);g.ring.material.opacity=Math.max(0,1-g.rt);if(g.rt>=1)g.ring.visible=false}
 const sd=g.site?Math.hypot(g.pos.x-g.site.x,g.pos.z-g.site.z):1e9;if(sd<34&&!rec.seen){rec.seen=1;toast(P.civ==1?'Ancient Ruins discovered':'Alien city discovered',P.civ==1?'Weathered pillars circle a humming monolith. Something wants to be read.':'Neon towers pierce the sky. A trade terminal glows at the center.','New civilization');sfx.disc()}
 g.loc=sd<34?(P.civ==1?'Ancient Ruins':'Alien City'):'Uncharted Wilds';$('#fuel i').style.transform='scaleX('+g.fuel.toFixed(2)+')'}

/* ===== Loot, inventory, UI ===== */
function take(it,q,at){if(it=='cr')cr+=q;else inv[it]=(inv[it]||0)+q;burst(at,it=='cr'?0xffd23f:0x9ff4ff);sfx.col();note('+'+q+' '+(it=='cr'?'¢ Credits':IT[it][1]+' '+IT[it][0]));hudNow()}
function burst(p,c){for(let i=0;i<12;i++){const s=sprite(c,rnd(.8,1.6)*(mode=='space'?6:1));s.position.copy(p);s.userData={v:V(rnd(-1,1),rnd(.3,1.5),rnd(-1,1)).normalize().multiplyScalar(rnd(4,9)*(mode=='space'?6:1)),l:1};RS.add(s);FX.push(s)}}
function note(t){const e=$('#note');e.textContent=t;e.classList.add('on');clearTimeout(tn);tn=setTimeout(()=>e.classList.remove('on'),2200)}
function toast(h,p,s){const e=$('#toast');e.innerHTML='<small class="hd" style="color:var(--dim);font-size:9px">'+s+'</small><h3>'+h+'</h3><p>'+p+'</p>';e.classList.add('on');clearTimeout(tq);tq=setTimeout(()=>e.classList.remove('on'),6000)}
function hudNow(){$('#cr').textContent=cr;if(mode=='space'){$('#l1').textContent=nm(hash(vg=GA,SY,3))+' System · '+nm(GA*977+11)+' Galaxy';const p=SH.np||SP.pl[0];$('#l2').textContent='Nearest: '+p.name+' · '+(((SH.alt||0)/10)|0)+' km';$('#sp').textContent=(SH.spd|0)+' u/s'}else if(SF){$('#l1').textContent=P.name+' · '+B.n;$('#l2').textContent=SF.loc;$('#sp').textContent=Object.values(inv).reduce((a,b)=>a+b,0)+' items'}}
function wpUpd(){const e=$('#wp');if(mode!='space'||!WP){e.style.display='none';return}TV.copy(WP.pos).project(cam);const b=TV.z>1;let x=TV.x*(b?-1:1),y=TV.y*(b?-1:1);const m=Math.max(Math.abs(x),Math.abs(y),1);x=clamp(x/m,-.9,.9);y=clamp(y/m,-.85,.8);e.style.display='block';e.style.transform='translate('+(x+1)/2*innerWidth+'px,'+(1-y)/2*innerHeight+'px) translate(-50%,-50%)';e.textContent='◈ '+WP.name+' · '+(((SH.pos.distanceTo(WP.pos)-WP.r)/10)|0)+' km'}
function ctxUi(){const s=(CX.int?'<b>E</b> '+CX.int.lab:'')+(CX.loot?'  <b>F</b> '+CX.loot.lab:'');if(s!=lastPr){lastPr=s;const e=$('#pr');e.innerHTML=s;e.classList.toggle('on',!!s);$('#bi').classList.toggle('hi',!!CX.int);$('#bl').classList.toggle('hi',!!CX.loot)}}
function ui(t){UI=t||'';const m=$('#modal');if(!t){m.style.display='none';trade=0;return}m.style.display='block';
 const tabs=[['map','🗺 Galaxy'],['bag','🎒 Cargo'],['ship','🛠 Ship']];if(trade)tabs.push(['trade','⚖ Trade']);
 let h='<div class="tabs">'+tabs.map(([k,l])=>'<button class="'+(k==t?'on':'')+'" onclick="ui(\''+k+'\')">'+l+'</button>').join('')+'<span>◎ '+cr+'¢</span><button onclick="ui()">✕</button></div>';
 if(t=='map'){h+='<h3 class="hd">'+nm(vg*977+11)+' Galaxy <button onclick="vg=Math.max(0,vg-1);ui(\'map\')">◀</button> <button onclick="vg++;ui(\'map\')">▶</button></h3><p style="color:var(--dim);margin:4px 0 8px">Every galaxy holds new systems and worlds. Jumps cost credits.</p><div class="grid">';
  for(let s=0;s<6;s++){const here=vg==GA&&s==SY;h+='<button class="'+(here?'on':'')+'" onclick="jump('+vg+','+s+')">'+nm(hash(vg,s,3))+'<br><small>'+(here?'You are here':(vg==GA?15:60)+'¢ jump')+'</small></button>'}
  h+='</div><h3 class="hd" style="margin:12px 0 4px">Planets</h3>'+SP.pl.map((p,i)=>'<div class="row"><b>'+p.name+'</b> '+BI[p.bi].n+' · '+(p.scan?['no life','ruins','alien city'][p.civ]:'unscanned')+'<button onclick="wp('+i+')">'+(WP==p?'◉ Waypoint':'Waypoint')+'</button></div>').join('');
  if(mode=='surf')h+='<p><button class="go" onclick="launch()">Launch to orbit ▸</button></p>'}
 else if(t=='bag'){const ks=Object.keys(inv);h+='<div class="grid">'+(ks.length?ks.map(k=>'<div class="it" style="border-color:'+rc(IT[k][2])+'"><div style="font-size:24px">'+IT[k][1]+'</div>'+IT[k][0]+'<br><b>×'+inv[k]+'</b> · '+IT[k][2]*inv[k]+'¢</div>').join(''):'<p style="color:var(--dim)">Cargo hold empty. Land on planets and loot minerals, scrap and artifacts, or grab drifting cargo pods in space.</p>')+'</div>'}
 else if(t=='ship'){h+='<h3 class="hd" style="margin-bottom:8px">Hull &amp; suit paint</h3>'+COLS.map((c,i)=>'<button class="sw" style="background:'+hex(c)+'" onclick="paint('+i+')"></button>').join(' ')+'<p style="color:var(--dim)">Thrusters Mk '+(up.t+1)+' · Jet tank Mk '+(up.f+1)+'. Upgrades are sold at alien city terminals.</p>'}
 else{const ks=Object.keys(inv);h+=ks.map(k=>'<div class="row">'+IT[k][1]+' <b>'+IT[k][0]+'</b> ×'+inv[k]+' · '+IT[k][2]+'¢<button onclick="sell(\''+k+'\',1)">Sell 1</button><button onclick="sell(\''+k+'\',9999)" style="margin-left:0">All</button></div>').join('')||'<p style="color:var(--dim)">Nothing to sell yet.</p>';
  h+='<h3 class="hd" style="margin:12px 0 4px">Upgrades</h3><div class="row">Thrusters Mk '+(up.t+1)+' (+30% top speed)<button onclick="buy(\'t\')">'+(up.t>=3?'Max':(up.t+1)*120+'¢')+'</button></div><div class="row">Jet tank Mk '+(up.f+1)+' (longer hover)<button onclick="buy(\'f\')">'+(up.f>=3?'Max':(up.f+1)*120+'¢')+'</button></div>'}
 $('#mb').innerHTML=h}
function jump(g,s){if(mode!='space')return toast('Launch to orbit first','The hyperdrive needs open space.','Navigation');if(g==GA&&s==SY)return;const c=g==GA?15:60;if(cr<c)return toast('Not enough credits','Loot cargo pods and sell cargo at an alien city terminal.','Hyperdrive');cr-=c;ui();sfx.warp();trans(()=>{GA=g;SY=s;buildSystem();place();setMode('space');hudNow()})}
function wp(i){WP=SP.pl[i];ui('map')}
function paint(i){col=COLS[i];SP.sh.m.color.set(col);if(SF){SF.ship.m.color.set(col);SF.hero.suit.color.set(col)}}
function sell(k,n){n=Math.min(n,inv[k]);cr+=IT[k][2]*n;inv[k]-=n;if(!inv[k])delete inv[k];sfx.col();hudNow();ui('trade')}
function buy(k){const c=(up[k]+1)*120;if(up[k]>=3)return;if(cr<c)return toast('Not enough credits','Sell some cargo first.','Trade');cr-=c;up[k]++;sfx.disc();hudNow();ui('trade')}
function act(n){if(mode!='space'&&mode!='surf')return;if(n=='map'||n=='bag'){ui(UI==n?'':n);return}if(UI)return;if(n=='scan')scan();else if(n=='int'&&CX.int)CX.int.f();else if(n=='loot'&&CX.loot)CX.loot.f()}

/* ===== Audio ===== */
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();out=AC.createGain();out.gain.value=muted?0:.55;out.connect(AC.destination);dly=AC.createDelay(1);dly.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.4;dly.connect(fb);fb.connect(dly);dly.connect(out)}
function padTo(n){scaleN=n;if(!AC)return;const t=AC.currentTime;pads.forEach(p=>{p.g.gain.setTargetAtTime(0,t,1.2);setTimeout(()=>{p.o.forEach(o=>o.stop());p.g.disconnect()},7000)});
 const g=AC.createGain(),f=AC.createBiquadFilter(),l=AC.createOscillator(),lg=AC.createGain(),o=[l];g.gain.value=0;f.type='lowpass';f.frequency.value=650;l.frequency.value=.11;lg.gain.value=280;l.connect(lg);lg.connect(f.frequency);
 n.forEach((q,i)=>[-5,5].forEach(d=>{const s=AC.createOscillator();s.type=i%2?'triangle':'sine';s.frequency.value=q;s.detune.value=d;s.connect(f);o.push(s)}));f.connect(g);g.connect(out);o.forEach(x=>x.start());g.gain.setTargetAtTime(.05,t,2.5);pads=[{g,o}]}
function pluck(f,v,type,d){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);g.connect(dly);o.start(t);o.stop(t+d+.1)}
function sweep(a,b,d){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);g.connect(dly);o.start(t);o.stop(t+d+.05)}
const arp=(b,st,v,ty,d,gp)=>st.forEach((s,i)=>setTimeout(()=>pluck(b*2**(s/12),v,ty,d),i*gp)),sfx={col:()=>arp(784,[0,4,7,12],.12,'triangle',.9,65),disc:()=>arp(440,[0,5,9,14],.1,'sine',2,140),scan:()=>sweep(220,1500,1.1),warp:()=>sweep(60,1400,1.3)};
setInterval(()=>{if(AC&&Math.random()<.6)pluck(scaleN[Math.random()*scaleN.length|0]*(Math.random()<.5?4:2),.045,'sine',3.2)},2300);

/* ===== Input ===== */
let drag=null;
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space')e.preventDefault();({KeyQ:'scan',KeyE:'int',KeyF:'loot',KeyM:'map',KeyI:'bag'})[e.code]&&act(({KeyQ:'scan',KeyE:'int',KeyF:'loot',KeyM:'map',KeyI:'bag'})[e.code]);if(e.code=='Escape')ui()});
addEventListener('keyup',e=>K[e.code]=0);addEventListener('blur',()=>{for(const k in K)K[k]=0;IN.thr=0});
R.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId&&mode=='surf'&&SF){SF.yaw-=(e.clientX-drag.x)*.006;SF.pit=clamp(SF.pit+(e.clientY-drag.y)*.004,.15,1.1);drag.x=e.clientX;drag.y=e.clientY}});
addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId)drag=null});
const jy=$('#joy'),kn=jy.firstChild;function jm(e){const r=jy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.min(1,Math.hypot(dx,dy)/46),a=Math.atan2(dy,dx);J.x=Math.cos(a)*l;J.y=Math.sin(a)*l;kn.style.transform='translate('+J.x*38+'px,'+J.y*38+'px)'}
jy.onpointerdown=e=>{jy.setPointerCapture(e.pointerId);jy.p=e.pointerId;jm(e)};jy.onpointermove=e=>{if(jy.p===e.pointerId)jm(e)};jy.onpointerup=jy.onpointercancel=()=>{jy.p=null;J.x=J.y=0;kn.style.transform=''};
const bt=$('#bt');bt.onpointerdown=e=>{e.preventDefault();IN.thr=1;bt.setPointerCapture(e.pointerId)};bt.onpointerup=bt.onpointercancel=()=>IN.thr=0;
[['#bs','scan'],['#bi','int'],['#bl','loot'],['#bmap','map'],['#bbag','bag']].forEach(([s,n])=>$(s).onpointerdown=e=>{e.preventDefault();act(n)});
document.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{muted^=1;if(out)out.gain.value=muted?0:.55;b.textContent=muted?'🔇':'🔊'});
$('#start').onclick=()=>{initAudio();AC.resume();padTo([65.4,98,130.8,196]);try{const e=document.documentElement;Promise.resolve(matchMedia('(pointer:coarse)').matches&&e.requestFullscreen&&e.requestFullscreen()).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(_){}
 setMode('space');toast('Welcome, explorer','Hold THRUST to fly to the ◈ waypoint, land with USE, then loot and scan. Open the map to hop between galaxies.','Mission');hudNow()};

/* ===== Boot & loop ===== */
buildSystem();place();setMode('title');let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1e3);last=now;tm+=dt;
 FX=FX.filter(s=>{const u=s.userData;u.l-=dt*1.4;s.position.addScaledVector(u.v,dt);u.v.multiplyScalar(1-dt*2);s.material.opacity=Math.max(0,u.l);if(u.l<=0){s.parent&&s.parent.remove(s);s.material.dispose();return false}return true});
 if(mode=='title'){shipPose();SP.sh.fl.scale.setScalar(2);cam.position.set(SH.pos.x+Math.cos(tm*.25)*14,SH.pos.y+4,SH.pos.z+Math.sin(tm*.25)*14);cam.lookAt(SH.pos)}
 else if(!UI){if(mode=='space')space(dt);else if(mode=='surf')surf(dt);if(mode=='space'||mode=='surf'){ctxUi();wpUpd();if(tm-lastHud>.25){lastHud=tm;hudNow();if(mode=='space')$('#fuel i').style.transform='scaleX('+clamp(SH.spd/(SH.mx||1),0,1).toFixed(2)+')'}}}
 R.render(RS,cam)}
requestAnimationFrame(loop);
</script></body></html>
